services:
  gjallar:
    build: .
    image: gjallar:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - backend/.env

    environment:
      SIGNAL_DATABASE_PATH: /data/signal.db
      SIGNAL_FRONTEND_DIR: /app/frontend_dist
      SIGNAL_DEBUG: "false"

    volumes:
      - gjallar-data:/data

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gjallar-data: